services:
  simple-app:
    build:
      context: ../..
      dockerfile: examples/simple_app/Dockerfile
    image: guard-core-php-simple-app:local
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PREFIX=${REDIS_PREFIX:-guard_core:}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # php:8.3-cli ships no wget or curl binary; probe with the runtime.
      test: ["CMD", "php", "-r", "exit((int) (@file_get_contents('http://127.0.0.1:8080/health') === false));"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  redis-data:
